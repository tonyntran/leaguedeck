server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy the API through nginx so the SPA is same-origin with the backend.
    # This is what makes phone/LAN/Tailscale access work: the browser only ever
    # talks to the host:port it loaded the page from, so no CORS is involved.
    # "backend" is the docker-compose service name.
    #
    # Note the /settings carve-out: the SPA owns the client-side route
    # /settings, while the API owns /settings/<resource> (e.g. /settings/sleeper).
    # Only sub-paths are proxied, so a hard refresh on /settings still serves
    # index.html. Keep this pattern in sync with server.proxy in vite.config.js.
    location ~ ^(/auth|/leagues|/sync-status|/health)(/|$)|^/settings/.+ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
